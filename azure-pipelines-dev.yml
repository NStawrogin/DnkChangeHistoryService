# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - develop
  paths:
    exclude:
      - azure-pipelines-advanced-security.yml

resources:
  repositories:
    - repository: self
    - repository: DnkChangeHistoryService-Deploy
      type: git
      ref: main
      name: DnkChangeHistoryService-Deploy

variables:
  # Container registry service connection established during pipeline creation
  - group: container-registry-group
  - name: imageRepository
    value: "dnkchangehistoryservice"
  - name: dockerfilePath
    value: "$(Build.SourcesDirectory)/DnkChangeHistoryService/DnkChangeHistoryService/Dockerfile"
  - name: tag
    value: "$(Build.BuildNumber)"
    # Agent VM image name
  - name: vmImageName
    value: "ubuntu-latest"

stages:
  - stage: Build
    displayName: Build and push stage
    lockBehavior: sequential
    variables:
      - group: changehistory-build-concurrency-lock-group

    jobs:
      - job: Test
        displayName: "Test"
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: DotNetCoreCLI@2
            displayName: "Restore tests"
            inputs:
              command: restore
              projects: |
                $(Build.SourcesDirectory)/DnkChangeHistoryService/DnkChangeHistoryService.Infrastructure.Tests/DnkChangeHistoryService.Infrastructure.Tests.csproj
                $(Build.SourcesDirectory)/DnkChangeHistoryService/DnkChangeHistoryService.Tests/DnkChangeHistoryService.Tests.csproj
                $(Build.SourcesDirectory)/DnkChangeHistoryService/DnkChangeHistoryService.FunctionalTests/DnkChangeHistoryService.FunctionalTests.csproj

          - task: DotNetCoreCLI@2
            displayName: "Test build"
            inputs:
              command: build
              projects: |
                $(Build.SourcesDirectory)/DnkChangeHistoryService.Infrastructure.Tests/DnkChangeHistoryService.Infrastructure.Tests.csproj
                $(Build.SourcesDirectory)/DnkChangeHistoryService.Tests/DnkChangeHistoryService.Tests.csproj
                $(Build.SourcesDirectory)/DnkChangeHistoryService.FunctionalTests/DnkChangeHistoryService.FunctionalTests.csproj
              arguments: --configuration $(buildConfiguration)

          # Excludes functional tests due to pricing of testcontainer framework in AzureDevops
          - task: DotNetCoreCLI@2
            displayName: "Run tests (except functional tests)"
            inputs:
              command: test
              projects: |
                $(Build.SourcesDirectory)/DnkChangeHistoryService.Infrastructure.Tests/DnkChangeHistoryService.Infrastructure.Tests.csproj
                $(Build.SourcesDirectory)/DnkChangeHistoryService.Tests/DnkChangeHistoryService.Tests.csproj
              arguments: --configuration $(buildConfiguration)
              publishTestResults: true
      - job: Build
        displayName: Build and Push
        dependsOn: Test
        condition: succeeded('Test')
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and push an image to container registry
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: "$(Build.SourcesDirectory)/DnkChangeHistoryService"
              containerRegistry: "$(registryServiceConnection)"
              tags: |
                latest
                $(tag)
  - stage: Deploy
    displayName: Update buildnumber in deployment repository
    jobs:
      - job: Deploy
        displayName: Deploy
        steps:
          - checkout: DnkChangeHistoryService-Deploy
            persistCredentials: true
          - script: |
              git pull origin main
              echo "Current values of buildNumber:"
              cat argo-cd/changehistory/values-dev.yaml
              echo "Updating buildNumber in values-dev.yaml..."
              yq e '.buildNumber = "$(Build.BuildNumber)"' -i argo-cd/changehistory/values-dev.yaml
              echo "Updated values of buildNumber:"
              cat argo-cd/changehistory/values-dev.yaml
          - script: |
              git config --global user.email "$(Build.RequestedForEmail)"
              git config --global user.name "$(Build.QueuedBy)"
              git commit -am "Deploy: $(Build.BuildNumber)"
              git remote -v
              git branch -al
              if git push origin HEAD:main; then
                echo "Changes pushed successfully"
              else
                echo "Push Failed"
                exit 1
              fi
