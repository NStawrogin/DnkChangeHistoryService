# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - release/*
      - hotfix/*

  paths:
    exclude:
      - azure-pipelines-advanced-security.yml

resources:
  repositories:
    - repository: self
    - repository: DnkPipelineTemplates
      type: git
      name: DnkPipelineTemplates
      ref: main
    - repository: DnkChangeHistoryService-Deploy
      type: git
      ref: main
      name: DnkChangeHistoryService-Deploy

variables:
  # Container registry service connection established during pipeline creation
  - group: stage-container-registry-group
  - name: imageRepository
    value: "dnkchangehistoryservice"
  - name: dockerfilePath
    value: "$(Build.SourcesDirectory)/DnkChangeHistoryService/DnkChangeHistoryService/Dockerfile"
  - name: tag
    value: "$(Build.BuildNumber)"
    # Deployment settings
  - name: valuesFilePath
    value: argo-cd/changehistory/$(valueFileName)    

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          name: $(poolName)
        steps:
          - checkout: self
          - template: azure-build-deploy-giz-template.yaml@DnkPipelineTemplates
            parameters:
              imageRepository: $(imageRepository)
              dockerfilePath: $(dockerfilePath)
              registryServiceConnection: $(registryServiceConnection)
              sourcesDirectory: $(Build.SourcesDirectory)/DnkChangeHistoryService
              tag: $(tag)

  - stage: Deploy
    displayName: Update buildnumber in deployment repository
    jobs:
      - job: Deploy
        displayName: Deploy
        pool:
          name: $(poolName)
        steps:
          - template: azure-deploy-giz-template.yaml@DnkPipelineTemplates
            parameters:
              deployTargetBranch: $(deployTargetBranch)
              valuesFilePath: $(valuesFilePath)
              deploymentRepository: DnkChangeHistoryService-Deploy
              buildScope: $(buildScope)
